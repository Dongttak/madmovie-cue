limit_req_zone $binary_remote_addr zone=cue_alpha_access:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name cue.example.invalid;
    # Certbot uses this directory without touching another application's routes.
    location /.well-known/acme-challenge/ {
        root /var/www/cue/acme;
    }

    # HTTPS ingress restored; retain ACME and reject plaintext processing requests.
    root /opt/cue-app/current;
    index index.html;
    location = /api/ncs/catalog {
        return 301 https://cue.example.invalid$request_uri;
    }
    location ^~ /api/ncs/ {
        default_type application/json;
        return 426 '{"error":"서버 영상 만들기는 HTTPS 주소에서 알파 계정으로 로그인한 뒤 사용할 수 있어요."}';
    }
    location ^~ /samples/ { return 404; }
    location ~* \.(mp3|wav|m4a|aac|ogg|flac|opus|aiff?)(/|$) { return 404; }

    location / {
        return 301 https://cue.example.invalid$request_uri;
    }
    access_log /var/log/nginx/cue.access.log;
    error_log /var/log/nginx/cue.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cue.example.invalid;
    root /opt/cue-app/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/cue.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cue.example.invalid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/ncs/catalog {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-CUE-User "";
        limit_except GET { deny all; }
    }
    location = /api/ncs/access {
        limit_req zone=cue_alpha_access burst=10 nodelay;
        limit_req_status 429;
        auth_basic "CUE alpha";
        auth_basic_user_file /etc/nginx/cue-alpha.htpasswd;
        root /var/www/cue;
        try_files /alpha-access.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/ncs/ {
        limit_req zone=cue_alpha_access burst=10 nodelay;
        limit_req_status 429;
        auth_basic "CUE alpha";
        auth_basic_user_file /etc/nginx/cue-alpha.htpasswd;
        client_max_body_size 150m;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header X-CUE-User $remote_user;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 210s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /samples/ { return 404; }
    location ~* \.(mp3|wav|m4a|aac|ogg|flac|opus|aiff?)(/|$) { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'self' blob:; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    }

    access_log /var/log/nginx/cue.access.log;
    error_log /var/log/nginx/cue.error.log;
}
