<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101418">
  <title>CUE — 매드무비 음악 작업실</title>
  <link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header><a class="logo" href="./">CUE<span> / 음악 작업실</span></a><span class="version">STEP 08 · 교전 유지 · 와이드</span></header>
    <section class="intro">
      <p class="eyebrow">좋은 컷은, 듣는 것부터.</p>
      <h1>장면이 터질 순간을 찾아보자.</h1>
      <p>음악의 타격점을 찾고, 교전 흐름을 살려 영상을 만들어보세요.</p>
      <a class="button primary" href="#mont-title">교전 영상으로 시작 ↘</a>
    </section>
    <section class="samples" aria-labelledby="samples-title">
      <div class="sample-heading"><div><p class="eyebrow">QUICK START</p><h2 id="samples-title">음원을 올리지 않고 시작</h2></div><span>브라우저 안에서 처리</span></div>
      <p class="sample-intro">내 음원 파일을 열면 이 브라우저에서만 분석해요. 파일 없이 시험하려면 아래에서 리듬 데모를 만들어보세요.</p>
      <div id="sample-tracks" class="sample-tracks">
        <button id="sample-demo" class="sample-card" aria-label="120 BPM 리듬 데모 듣고 분석"><span class="sample-number">01 / RHYTHM TEST</span><strong>120 BPM 데모 <span aria-hidden="true">↗</span></strong><span>CUE 자체 제작 · 24초</span><span class="sample-action">박자 맞춰보기</span></button>
      </div>
      <p id="sample-status" role="status" aria-live="polite">테스트 소리를 만들거나 아래에서 내 음원 파일을 열어주세요.</p>
      <p>서버 영상 만들기는 알파 계정이 필요해요. <a id="server-login" href="/api/ncs/access" target="_blank" rel="noopener noreferrer">서버 로그인 ↗</a> 후 열린 탭에서 ‘CUE로 돌아가기’를 누르세요. 로컬 분석은 로그인 없이 사용할 수 있어요.</p>
      <details class="ncs-catalog"><summary>NCS 예시곡 가져와 쇼츠 만들기</summary>
      <p>공식 곡을 고르면 음악 파일을 따로 준비하지 않고 게임 영상에 입힐 수 있어요. 게임 영상은 서버로 전송되며, 합성용 임시 파일은 처리 후 삭제돼요. 최대 60초 · 9:16 · MP4.</p>
      <div class="ncs-search-row"><label for="ncs-search">곡명·아티스트·장르 검색</label><input id="ncs-search" type="search" placeholder="예: Janji, Mortals, Drum &amp; Bass" disabled><span id="ncs-count" role="status" aria-live="polite">목록 불러오는 중</span></div>
      <div class="clip-fields">
        <label>예시곡<select id="ncs-track" disabled><option>목록 불러오는 중</option></select></label>
        <label>음악 시작 (초)<input id="ncs-music-start" type="number" min="0" step="0.1" value="0" disabled></label>
        <label>길이<select id="ncs-length" disabled><option value="15">15초</option><option value="30" selected>30초</option><option value="45">45초</option><option value="60">60초</option></select></label>
        <label>게임 영상 · 최대 150MB<input id="ncs-file" type="file" accept="video/*" disabled></label>
        <label>영상 시작 (초)<input id="ncs-video-start" type="number" min="0" step="0.1" value="0" disabled></label>
      </div>
      <p>곡의 구간은 <a id="ncs-listen" href="https://ncs.io/" target="_blank" rel="noopener noreferrer">NCS 공식 듣기 ↗</a>에서 확인해 시작 시간을 정하세요. 영상 원본 소리는 빼고 선택한 음악을 입혀요. 남은 영상이나 음악이 짧으면 그 길이에 맞춰요.</p>
      <video id="ncs-source" controls muted playsinline preload="metadata" hidden></video>
      <div class="clip-buttons"><button id="ncs-render" class="button primary" disabled>NCS 쇼츠 만들기</button><button id="ncs-cancel" class="button secondary" hidden>요청 취소</button><a id="ncs-download" class="button secondary" hidden>완성 MP4 저장</a><button id="ncs-retry" class="button secondary">목록 다시 불러오기</button></div>
      <p id="ncs-status" role="status" aria-live="polite">NCS 목록을 불러오고 있어요.</p>
      <video id="ncs-result" controls playsinline hidden></video>
      <label class="ncs-credit-label" for="ncs-credit">게시할 때 설명란에 넣을 음악 출처</label><textarea id="ncs-credit" readonly rows="4"></textarea>
      <p>공식 듣기와 NCS 이용 범위</p><ul><li><a href="https://www.youtube.com/watch?v=J2X5mJ3HDYE" target="_blank" rel="noopener noreferrer">DEAF KEV — Invincible ↗</a></li><li><a href="https://www.youtube.com/watch?v=p7ZsBPK656s" target="_blank" rel="noopener noreferrer">Disfigure — Blank ↗</a></li><li><a href="https://www.youtube.com/watch?v=__CRWE-L45k" target="_blank" rel="noopener noreferrer">Electro-Light — Symbolism ↗</a></li></ul><a href="https://ncs.io/usage-policy/terms" target="_blank" rel="noopener noreferrer">NCS 이용 범위</a></details>
      <div class="requested-track"><div><span>요청한 노래</span><strong>1-800 <small>bbno$ &amp; Ironmouse</small></strong><p>원본 음악 서비스로 이동해요. CUE에서 음원 파일을 제공하지 않아요.</p></div><a class="button secondary" href="https://broke.ffm.to/1800" target="_blank" rel="noopener noreferrer">공식 음원 서비스 ↗</a></div>
    </section>
    <section class="clip-editor montage" aria-labelledby="mont-title">
      <div class="analysis-heading"><div><p class="eyebrow">ENGAGEMENT / 07</p><h2 id="mont-title">교전 흐름을 살려 영상 만들기</h2></div><span>1~8클립 · 최대 60초</span></div>
      <p class="sample-intro">한 영상에서 교전 시작부터 마무리까지 골라보세요. 기본 모드는 선택한 구간 안을 자르거나 속도를 바꾸지 않아요. 여러 구간을 추가하면 지정한 순서로 연결해요.</p>
      <div class="clip-fields">
        <label>곡명·아티스트·장르 검색<input id="mont-search" type="search" placeholder="예: Royalty" disabled></label>
        <label>NCS 곡<select id="mont-track" disabled><option>목록 불러오는 중</option></select></label>
        <label>음악 시작 (초)<input id="mont-music-start" type="number" min="0" step="0.1" value="0" disabled></label>
        <label id="mont-length-label" hidden>완성 길이<select id="mont-length" disabled><option value="15">15초</option><option value="30" selected>30초</option><option value="45">45초</option><option value="60">60초</option></select></label>
      </div>
      <div class="clip-fields">
        <label>편집 방식<select id="mont-mode"><option value="continuity">교전 구간 통째로 유지</option><option value="beats">박자에 맞춰 길이 배분</option></select></label>
        <label>화면 비율<select id="mont-layout"><option value="wide">와이드 · 1280×600</option><option value="landscape">가로 · 1280×720</option><option value="portrait">세로 · 720×1280</option></select></label>
        <label>출력 프레임<select id="mont-fps"><option value="60">60fps</option><option value="30">30fps</option></select></label>
        <label class="clip-loop"><input id="mont-game-audio" type="checkbox" checked>게임 소리와 음악 함께 살리기</label>
      </div>
      <p id="mont-mode-help" class="sample-intro">선택한 교전 안에 자동 컷·전환·슬로모션을 넣지 않아요. 와이드는 위아래 HUD 일부를 잘라 중앙 교전에 집중해요. 60fps는 원본에 없는 동작을 새로 만들지는 않아요.</p>
      <p class="sample-intro"><a id="mont-listen" href="https://ncs.io/" target="_blank" rel="noopener noreferrer">NCS 공식 듣기 ↗</a>에서 음악 시작 위치를 확인하세요. 게임 소리는 음악 아래에 섞고, 파일에 원본 소리가 없으면 음악만 사용해요.</p>
      <div id="mont-beat-settings" class="clip-fields" hidden><label>수동 BPM · 비우면 자동<input id="mont-bpm" type="number" min="30" max="300" step="0.1" placeholder="자동 추정" disabled></label><label>첫 박자 · 원곡 초, 수동 BPM에 적용<input id="mont-offset" type="number" min="0" step="0.001" value="0" disabled></label></div><div class="clip-fields"><label>교전 영상 추가<input id="mont-files" type="file" accept="video/*" multiple disabled></label></div>
      <p id="mont-files-summary" class="sample-intro">0 / 8개 · 합계 최대 150MB</p>
      <ol id="mont-clips" class="mont-clips" aria-label="선택한 하이라이트 클립"></ol>
      <p id="mont-source-caption" class="sample-intro" hidden></p>
      <video id="mont-source" controls playsinline preload="metadata" hidden></video>
      <div id="mont-range-tools" class="clip-buttons" hidden><button id="mont-set-start" class="button secondary">현재 위치를 시작으로</button><button id="mont-set-end" class="button secondary">현재 위치를 끝으로</button></div>
      <div class="clip-buttons"><button id="mont-plan" class="button primary" disabled>선택 구간 확인</button><button id="mont-render" class="button primary" disabled>매드무비 MP4 만들기</button><button id="mont-json" class="button secondary" disabled>배치 JSON 저장</button><button id="mont-cancel" class="button secondary" hidden>요청 취소</button><a id="mont-download" class="button secondary" hidden>완성 MP4 저장</a><button id="mont-retry" class="button secondary">목록 다시 불러오기</button></div>
      <p id="mont-summary" class="sample-intro">교전의 시작·끝과 음악을 고른 뒤 선택 구간을 확인하세요.</p>
      <div class="mont-table-wrap"><table class="mont-table"><caption>컷 배치 미리보기 · 초</caption><thead><tr><th scope="col">클립</th><th scope="col">완성 영상 구간</th><th scope="col">원본 사용 구간</th></tr></thead><tbody id="mont-plan-rows"></tbody></table></div>
      <p id="mont-status" role="status" aria-live="polite">음악 목록을 불러오고 있어요.</p>
      <video id="mont-result" controls playsinline hidden></video>
      <label class="ncs-credit-label" for="mont-credit">게시할 때 설명란에 넣을 음악 출처</label><textarea id="mont-credit" readonly rows="4"></textarea>
      <p class="sample-intro">영상 파일은 만들기를 누르면 서버로 전송되고 작업 후 삭제돼요. 구간 확인 단계에는 영상 파일을 보내지 않아요. 교전 유지 모드는 선택한 시작·끝을 프레임 안쪽으로 맞춰 전부 사용해요. 합계 60초를 넘거나 음악이 모자라면 알려주며, 몰래 잘라내거나 반복하지 않아요. 와이드·가로·세로 설정에 따라 프레이밍이 달라져요.</p>
    </section>
    <section class="workspace" aria-label="음악 플레이어">
      <div class="track-header"><div><p class="eyebrow">TRACK / 01</p><h2 id="track-name">아직 불러온 노래가 없어요</h2><p id="track-info">MP3, WAV, M4A, OGG 등 브라우저가 지원하는 음원</p></div>
        <button id="open" class="button primary">음원 파일 열기 <span aria-hidden="true">↗</span></button>
        <input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac" hidden>
      </div>
      <div id="drop-zone" class="wave-area">
        <canvas id="wave" aria-hidden="true"></canvas>
        <div id="empty"><span class="empty-icon" aria-hidden="true">▥</span><strong>여기에 노래를 놓아주세요</strong><span>또는 위의 ‘음원 파일 열기’를 눌러 시작하세요</span></div>
        <input id="seek" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="재생 위치">
      </div>
      <div class="legend"><label><input id="show-beats" type="checkbox" checked> <span class="beat-key">│</span> 박자</label><label><input id="show-onsets" type="checkbox" checked> <span class="onset-key">▼</span> 타격 후보</label></div>
      <div class="ruler"><span>00:00</span><span id="quarter">—</span><span id="half">—</span><span id="three-quarter">—</span><span id="duration-label">—</span></div>
      <div class="transport">
        <div class="play-controls"><button id="back" class="button secondary" disabled aria-label="5초 뒤로">−5초</button><button id="play" class="button play" disabled>재생</button><button id="forward" class="button secondary" disabled aria-label="5초 앞으로">+5초</button></div>
        <div class="time"><strong id="current">00:00.0</strong><span> / </span><span id="total">00:00.0</span></div>
        <label class="volume">음량 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="음량"></label>
      </div>
      <p id="status" role="status" aria-live="polite">음원을 불러오면 파형이 표시됩니다.</p>
    </section>
    <div class="notes"><p><span>⌨</span> Space 재생·일시정지 · ← → 5초 이동 · 파형 클릭으로 이동</p><p>음원은 이 브라우저에서만 처리됩니다.</p></div>
    <section class="clip-editor" aria-labelledby="clip-title">
      <div class="analysis-heading"><div><p class="eyebrow">HIGHLIGHT / 03</p><h2 id="clip-title">하이라이트 구간 고르기</h2></div><span id="clip-summary">음원을 먼저 열어주세요</span></div>
      <p class="sample-intro">길이를 고르고 슬라이더로 구간을 옮겨보세요. 초록 영역이 선택 구간이에요.</p>
      <div class="clip-fields">
        <label>구간 길이<select id="clip-length" disabled><option value="15">15초</option><option value="30" selected>30초</option><option value="45">45초</option><option value="60">60초</option><option value="custom">직접 지정</option></select></label>
        <label>시작 (초)<input id="clip-start" type="number" min="0" step="0.001" value="0" disabled></label>
        <label>끝 (초)<input id="clip-end" type="number" min="0" step="0.001" value="0" disabled></label>
        <label class="clip-loop"><input id="clip-loop" type="checkbox" checked disabled> 구간 반복</label>
      </div>
      <label class="clip-position-label" for="clip-position">선택 구간 이동</label><input id="clip-position" type="range" min="0" max="1" step="0.001" value="0" disabled>
      <div class="clip-buttons"><button id="clip-preview" class="button primary" disabled>구간 미리듣기</button><button id="clip-full" class="button secondary" disabled>전체곡 듣기</button></div>
      <p id="clip-status" role="status" aria-live="polite">노래를 열면 하이라이트 후보를 고를 수 있어요.</p>
      <div id="clip-suggestions" class="clip-suggestions" aria-label="에너지 기준 하이라이트 후보"></div>
    </section>
    <section class="clip-editor" aria-labelledby="shorts-title">
      <div class="analysis-heading"><div><p class="eyebrow">SHORTS / 04</p><h2 id="shorts-title">음악을 입혀 쇼츠 만들기</h2></div><span>9:16 · 720 × 1280</span></div>
      <p class="sample-intro">위에서 고른 음악 구간을 게임 영상과 합쳐요. 영상 전체가 보이도록 여백을 넣으며, 원본 영상 소리는 제외해요. 최대 60초, 영상이 짧으면 그 길이에 맞춰요.</p>
      <div class="clip-fields"><label>게임 영상 파일<input id="shorts-file" type="file" accept="video/*"></label><label>영상 시작 (초)<input id="shorts-start" type="number" min="0" step="0.1" value="0"></label></div>
      <video id="shorts-source" controls muted playsinline preload="metadata" hidden></video>
      <div class="clip-buttons"><button id="shorts-render" class="button primary" disabled>쇼츠 영상 만들기</button><button id="shorts-cancel" class="button secondary" hidden>만들기 취소</button><a id="shorts-download" class="button secondary" hidden>완성 영상 저장</a></div>
      <p id="shorts-status" role="status" aria-live="polite">음악과 게임 영상을 골라주세요. 파일은 서버에 올리지 않아요. 음악만 따로 저장하는 기능은 없어요.</p>
      <p class="sample-intro">만드는 동안 이 탭을 열어두세요. 영상 길이만큼 시간이 걸려요. MP4 녹화를 지원하지 않는 브라우저에서는 WebM으로 저장해요.</p>
      <video id="shorts-result" controls playsinline hidden></video>
    </section>
    <section class="analysis" aria-labelledby="analysis-title">
      <div class="analysis-heading"><div><p class="eyebrow">RHYTHM / 02</p><h2 id="analysis-title">박자와 타격 지점</h2></div><span id="analysis-summary">음원을 먼저 열어주세요</span></div>
      <p id="analysis-status" role="status" aria-live="polite">자동 추정은 편집을 시작하기 위한 힌트예요. 최종 타이밍은 귀로 확인하세요.</p>
      <form id="beat-form" class="beat-form">
        <label>BPM <input id="bpm" type="number" min="30" max="300" step="0.1" placeholder="자동 추정" required disabled></label>
        <label>첫 박자 (초) <input id="offset" type="number" min="0" step="0.001" value="0" required disabled></label>
        <button id="apply-beats" class="button primary" disabled>박자 보정 적용</button>
        <button id="use-position" type="button" class="button secondary" disabled>현재 위치를 첫 박자로</button>
        <button id="reset-beats" type="button" class="button secondary" disabled>자동값 복원</button>
      </form>
      <p class="analysis-hint">BPM이 배수·분할로 잡히거나 박자선이 밀리면 보정해 주세요. 첫 박자는 그 이전의 박자선을 숨기는 기준점이에요.</p>
      <div class="candidate-header"><h3>타격 후보 <span id="onset-count">0</span></h3><p>강도 높은 최대 100개를 시간순으로 보여줘요. 시간을 누르면 이동하고, 재생 중에는 이어서 들을 수 있어요.</p></div>
      <div id="onset-list" class="onset-list"><p>아직 분석한 타격 후보가 없어요.</p></div>
    </section>
    <footer>CUE <span>매드무비의 첫 장면, 음악에서 시작.</span></footer>
  </main>
  <audio id="audio" preload="metadata"></audio>
</body>
</html>
